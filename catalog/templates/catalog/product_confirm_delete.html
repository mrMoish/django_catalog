{% extends 'catalog/base.html' %}

{% block title %}Удаление продукта — Каталог{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm border-danger">
            <div class="card-body p-4">
                <h1 class="h3 mb-3">Удаление продукта</h1>
                <p class="mb-4">
                    Вы действительно хотите удалить продукт «<strong>{{ object.name }}</strong>»?
                    Это действие нельзя отменить.
                </p>
                <form method="post" class="d-flex gap-2">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Да, удалить</button>
                    <a href="{% url 'catalog:product_detail' object.pk %}" class="btn btn-outline-secondary">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
