{% extends "catalog/base.html" %}

{% block title %}{% if object %}Редактирование записи{% else %}Новая запись{% endif %}{% endblock %}

{% block content %}
<h1>{% if object %}Редактирование записи{% else %}Новая запись{% endif %}</h1>
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Сохранить</button>
  <a href="{% url 'blog:list' %}" class="btn btn-outline-secondary">Отмена</a>
</form>
{% endblock %}
