{% extends "catalog/base.html" %}

{% block title %}Удаление записи{% endblock %}

{% block content %}
<h1>Удалить запись «{{ object.title }}»?</h1>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Да, удалить</button>
  <a href="{% url 'blog:detail' object.pk %}" class="btn btn-outline-secondary">Отмена</a>
</form>
{% endblock %}
